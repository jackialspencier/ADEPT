### ADEPT on BillSum (Qwen3-1.7B) — launch from ADEPT/LLaMA-Factory/
### Hyperparams aligned with gemma2_adept_billsum.yaml / shared domain FT plan:
###   max_samples=1000, cutoff_len=2048, effective batch 32 (2×16),
###   lr=1e-5 cosine, 3 epochs, warmup_ratio=0.1 (ADEPT), bf16, flash_attn disabled
### Expand k=4 (qwen3-1.7b suggested layers 23,24,25,27 → freeze_trainable_layers=4)
###
### Weights:  ../../models/trained/qwen3-1.7b/adept/billsum/
### Expanded: ../../models/expanded/qwen3-1.7b-adept-k4/
### Env: REPO_ROOT, ADEPT_EVAL_DATA_PATH, ADEPT_IMPORTANCE_EVAL_STEPS

### model (ADEPT expanded intermediate)
model_name_or_path: ../../models/expanded/qwen3-1.7b-adept-k4
trust_remote_code: true
flash_attn: disabled

### method — train only expanded blocks + ADEPT dynamic LR callback
stage: sft
do_train: true
finetuning_type: freeze
freeze_trainable_layers: 4
freeze_trainable_modules: all
use_llama_pro: true
pure_bf16: true

### dataset
dataset_dir: ../../LlamaFactory/data
dataset: billsum_train
# Domain FT / metrics: avoid think-span; matches pretrained eval TEMPLATE=qwen3_nothink
template: qwen3_nothink
cutoff_len: 2048
max_samples: 1000
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output (finetuned weights — NOT under results/)
output_dir: ../../models/trained/qwen3-1.7b/adept/billsum
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 16
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
ddp_timeout: 180000000
