### ADEPT domain YAML template notes
### Runtime scripts rewrite absolute paths via ADEPT/scripts/03_train_domain.sh
### Launch cwd: ADEPT/LLaMA-Factory/
### Required env: REPO_ROOT, ADEPT_EVAL_DATA_PATH, ADEPT_IMPORTANCE_EVAL_STEPS

### model
model_name_or_path: ../../models/expanded/gemma-2-2b-it-adept-k4
trust_remote_code: true
flash_attn: disabled

### method
stage: sft
do_train: true
finetuning_type: freeze
freeze_trainable_layers: 4
freeze_trainable_modules: all
use_llama_pro: true
pure_bf16: true

### dataset
dataset_dir: ../../LlamaFactory/data
dataset: PLACEHOLDER_DATASET
template: gemma2
cutoff_len: 2048
max_samples: 1000
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: ../../models/trained/gemma-2-2b-it/adept/PLACEHOLDER_DOMAIN
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 16
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
ddp_timeout: 180000000
