### ADEPT on BillSum — launch from ADEPT/LLaMA-Factory/
### See $REPO_ROOT/results/LAYOUT.txt
###
### Weights:  ../../models/trained/{MODEL}/adept/{domain}/
### Eval:     ../../results/{MODEL}/adept/{domain}/eval/
### Logs:     ../../results/{MODEL}/adept/logs/   (ALL adept logs; name by stage/domain)
### Expanded: ../../models/expanded/{MODEL}-adept-k4/
###
### Env for dynamic LR callback:
###   export REPO_ROOT=/path/to/LlamaFactory_baseline
###   export ADEPT_EVAL_DATA_PATH=$REPO_ROOT/shared/data/adept_general_competence.json

### model (ADEPT expanded intermediate)
model_name_or_path: ../../models/expanded/gemma-2-2b-it-adept-k4
trust_remote_code: true
flash_attn: disabled

### method — train only expanded blocks + ADEPT dynamic LR callback
stage: sft
do_train: true
finetuning_type: freeze
# Must match calc_importance --top_k_expand (paper B.7 main: 4)
freeze_trainable_layers: 4
freeze_trainable_modules: all
use_llama_pro: true
pure_bf16: true

### dataset
dataset_dir: ../../LlamaFactory/data
dataset: billsum_train
template: gemma2
cutoff_len: 2048
max_samples: 1000
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output (finetuned weights — NOT under results/)
output_dir: ../../models/trained/gemma-2-2b-it/adept/billsum
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 16
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
ddp_timeout: 180000000
